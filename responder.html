<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Día del Psicólogo — Responde</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0b0b14;
    --surface: rgba(255,255,255,0.04);
    --border: rgba(255,255,255,0.1);
    --text: rgba(255,255,255,0.88);
    --muted: rgba(255,255,255,0.38);
    --accent: #9b7fe8;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 0 40px;
  }

  /* Ambient */
  body::before {
    content: '';
    position: fixed;
    top: -120px; left: 50%;
    transform: translateX(-50%);
    width: 320px; height: 320px;
    border-radius: 50%;
    background: radial-gradient(circle, #7c5cbf44 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* Header */
  header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 24px 16px;
    position: relative;
    z-index: 1;
  }

  .logo-space {
    width: 60px;
    height: 38px;
    border: 1px dashed rgba(255,255,255,0.12);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 8px;
    color: rgba(255,255,255,0.18);
    letter-spacing: 0.05em;
    text-align: center;
    line-height: 1.3;
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    font-weight: 400;
    color: rgba(255,255,255,0.7);
    text-align: center;
    flex: 1;
    padding: 0 12px;
  }

  /* Main card */
  main {
    width: 100%;
    max-width: 480px;
    padding: 0 20px;
    position: relative;
    z-index: 1;
    margin-top: 12px;
  }

  /* Question */
  #question-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 24px;
    text-align: center;
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
  }

  #question-box::before {
    content: '"';
    position: absolute;
    top: -10px; left: 10px;
    font-family: 'Playfair Display', serif;
    font-size: 80px;
    color: var(--accent);
    opacity: 0.12;
    line-height: 1;
    pointer-events: none;
  }

  #question-label {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    opacity: 0.7;
    margin-bottom: 14px;
  }

  #question-text {
    font-family: 'Playfair Display', serif;
    font-size: clamp(18px, 5vw, 24px);
    line-height: 1.5;
    font-style: italic;
    color: var(--text);
    min-height: 40px;
  }

  /* Semestre selector */
  .field-label {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  #semestre-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 8px;
    margin-bottom: 24px;
  }

  .sem-btn {
    padding: 10px 8px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.18s;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .sem-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 10px;
    opacity: 0;
    transition: opacity 0.18s;
  }

  .sem-btn.selected {
    border-color: var(--sem-color, var(--accent));
    color: #fff;
    background: color-mix(in srgb, var(--sem-color, var(--accent)) 18%, transparent);
  }

  .sem-btn.selected::before {
    background: var(--sem-color, var(--accent));
    opacity: 0.12;
  }

  .sem-dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    margin-right: 5px;
    vertical-align: middle;
    margin-top: -1px;
  }

  /* Textarea */
  #respuesta-field {
    margin-bottom: 20px;
  }

  textarea {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    color: var(--text);
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    font-style: italic;
    line-height: 1.6;
    resize: none;
    outline: none;
    transition: border-color 0.2s;
    min-height: 120px;
  }

  textarea::placeholder { color: var(--muted); font-style: italic; }
  textarea:focus { border-color: rgba(155, 127, 232, 0.4); }

  #char-count {
    text-align: right;
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
  }

  /* Submit */
  #submit-btn {
    width: 100%;
    padding: 16px;
    border-radius: 14px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.03em;
    position: relative;
    overflow: hidden;
  }

  #submit-btn:disabled {
    background: rgba(155, 127, 232, 0.3);
    cursor: not-allowed;
    color: rgba(255,255,255,0.4);
  }

  #submit-btn:not(:disabled):active {
    transform: scale(0.98);
  }

  /* Error */
  #error-msg {
    background: rgba(224, 92, 92, 0.12);
    border: 1px solid rgba(224, 92, 92, 0.3);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 13px;
    color: #e05c5c;
    margin-bottom: 16px;
    display: none;
  }

  /* Success screen */
  #success-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 60px 24px;
  }

  #success-icon {
    width: 80px; height: 80px;
    border-radius: 50%;
    background: rgba(92, 187, 110, 0.12);
    border: 1px solid rgba(92, 187, 110, 0.3);
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
    margin-bottom: 28px;
    animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes popIn {
    from { transform: scale(0); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  #success-title {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    margin-bottom: 12px;
  }

  #success-sub {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
    max-width: 280px;
  }

  /* Loading */
  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-right: 8px;
    vertical-align: middle;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  #back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    font-size: 13px;
    text-decoration: none;
    padding: 8px 14px;
    border-radius: 50px;
    border: 1px solid rgba(255,255,255,0.08);
    transition: all 0.2s;
    margin-bottom: 8px;
  }

  #back-btn:hover {
    color: var(--text);
    border-color: rgba(255,255,255,0.2);
  }
</style>
</head>
<body>

<header>
  <div class="logo-space">LOGO<br>FACULTAD</div>
  <h1>Día del Psicólogo</h1>
  <div class="logo-space">LOGO<br>UJED</div>
</header>

<main>
  <a id="back-btn" href="index.html">&#8592; Ver proyeccion</a>

  <!-- Form -->
  <div id="form-section">
    <div id="question-box">
      <div id="question-label">La pregunta de hoy</div>
      <div id="question-text">Cargando…</div>
    </div>

    <div class="field-label">¿Quién responde?</div>
    <div id="semestre-grid"></div>

    <div id="respuesta-field">
      <div class="field-label">Tu respuesta</div>
      <textarea id="respuesta" maxlength="200" placeholder="Escribe aquí, con honestidad…" rows="4"></textarea>
      <div id="char-count">0 / 200</div>
    </div>

    <div id="error-msg"></div>

    <button id="submit-btn" disabled>Compartir mi voz</button>
  </div>

  <!-- Success -->
  <div id="success-screen">
    <div id="success-icon">✦</div>
    <div id="success-title">Gracias por compartir</div>
    <div id="success-sub">Tu respuesta ya forma parte de la conversación colectiva.</div>
  </div>
</main>

<script>
// ── FIREBASE CONFIG ── Reemplaza con tus credenciales
const firebaseConfig = {
    apiKey: "AIzaSyDASkxSlQ-wLmX2v7Vs9-7GzA-gwDaB5Vo",
    authDomain: "dia-del-psicologo.firebaseapp.com",
    databaseURL: "https://dia-del-psicologo-default-rtdb.firebaseio.com",
    projectId: "dia-del-psicologo",
    storageBucket: "dia-del-psicologo.firebasestorage.app",
    messagingSenderId: "1043828123841",
    appId: "1:1043828123841:web:fafe15e9b723ed83b48c40"
  };

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ── SEMESTRES ──
const SEMESTRES = [
  { key: '1', label: '1° Semestre',  color: '#e05c8a' },
  { key: '2', label: '2° Semestre',  color: '#e0885c' },
  { key: '3', label: '3° Semestre',  color: '#d4c44a' },
  { key: '4', label: '4° Semestre',  color: '#5cbb6e' },
  { key: '5', label: '5° Semestre',  color: '#4ab8c4' },
  { key: '6', label: '6° Semestre',  color: '#5c8ae0' },
  { key: '7', label: '7° Semestre',  color: '#9b6be0' },
  { key: '8', label: '8° Semestre',  color: '#e06b8a' },
  { key: 'maestro', label: 'Maestro/a', color: '#c0c0c0' },
  { key: 'otro',    label: 'Otro',       color: '#888888' },
];

let selectedSemestre = null;

const grid = document.getElementById('semestre-grid');
SEMESTRES.forEach(s => {
  const btn = document.createElement('button');
  btn.className = 'sem-btn';
  btn.dataset.key = s.key;
  btn.style.setProperty('--sem-color', s.color);
  btn.innerHTML = `<span class="sem-dot" style="background:${s.color}"></span>${s.label}`;
  btn.addEventListener('click', () => {
    document.querySelectorAll('.sem-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedSemestre = s.key;
    validate();
  });
  grid.appendChild(btn);
});

// ── TEXTAREA ──
const textarea = document.getElementById('respuesta');
const charCount = document.getElementById('char-count');
textarea.addEventListener('input', () => {
  charCount.textContent = `${textarea.value.length} / 200`;
  validate();
});

function validate() {
  const ok = selectedSemestre && textarea.value.trim().length >= 5;
  document.getElementById('submit-btn').disabled = !ok;
}

// ── QUESTION ──
db.ref('pregunta').on('value', snap => {
  document.getElementById('question-text').textContent = snap.val() || '—';
});

// ── SUBMIT ──
document.getElementById('submit-btn').addEventListener('click', async () => {
  const texto = textarea.value.trim();
  const errorEl = document.getElementById('error-msg');
  errorEl.style.display = 'none';

  if (!selectedSemestre || texto.length < 5) return;

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Enviando…';

  try {
    await db.ref('respuestas').push({
      texto,
      semestre: selectedSemestre,
      ts: Date.now()
    });
    document.getElementById('form-section').style.display = 'none';
    document.getElementById('success-screen').style.display = 'flex';
  } catch (err) {
    errorEl.textContent = 'Ocurrió un error al enviar. Intenta de nuevo.';
    errorEl.style.display = 'block';
    btn.disabled = false;
    btn.innerHTML = 'Compartir mi voz';
  }
});
</script>
</body>
</html>
