<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Voces — Día del Psicólogo</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --header-h:72px; --footer-h:52px; }

  html,body { width:100%;height:100%;overflow:hidden;background:#0a0a12;font-family:'DM Sans',sans-serif; }
  body { cursor:grab; }
  body.dragging { cursor:grabbing; }
  @media(hover:none){ body,body.dragging{ cursor:default; } }

  #canvas { position:fixed;inset:0;width:100%;height:100%;touch-action:none; }

  /* ── HEADER ── */
  #header {
    position:fixed;top:0;left:0;right:0;z-index:200;
    height:var(--header-h);
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:8px 16px 0;
    background:linear-gradient(to bottom,rgba(10,10,18,0.98) 60%,transparent 100%);
    pointer-events:none;
    gap:6px;
  }

  #question-display {
    text-align:center;
    font-family:'Playfair Display',serif;
    font-style:italic;
    font-size:clamp(12px,2.8vw,21px);
    color:rgba(255,255,255,0.9);
    line-height:1.3;
    max-width:680px;width:100%;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }

  /* Tab switcher */
  #tabs {
    display:flex;gap:6px;
    pointer-events:all;
  }

  .tab-btn {
    display:flex;align-items:center;gap:5px;
    padding:4px 13px;
    border-radius:50px;
    border:1px solid rgba(255,255,255,0.12);
    background:rgba(255,255,255,0.04);
    color:rgba(255,255,255,0.4);
    font-family:'DM Sans',sans-serif;
    font-size:11px;
    cursor:pointer;
    transition:all 0.2s;
    white-space:nowrap;
  }
  .tab-btn .shape-icon { width:10px;height:10px;flex-shrink:0; }
  .tab-btn .shape-icon.circle { border-radius:50%; }
  .tab-btn .shape-icon.square { border-radius:2px; }
  .tab-btn .shape-icon.star {
    clip-path: polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
    border-radius:0;
  }

  .tab-btn.active {
    background:rgba(155,127,232,0.18);
    border-color:rgba(155,127,232,0.5);
    color:rgba(255,255,255,0.9);
  }

  /* ── FOOTER ── */
  #footer {
    position:fixed;bottom:0;left:0;right:0;z-index:200;
    height:var(--footer-h);
    display:flex;align-items:center;justify-content:space-between;
    padding:0 16px;gap:10px;
    background:linear-gradient(to top,rgba(10,10,18,0.98) 55%,transparent 100%);
  }

  #counter { display:flex;align-items:baseline;gap:3px;flex-shrink:0; }
  #count-num { font-family:'Playfair Display',serif;font-size:18px;color:rgba(255,255,255,0.2); }
  #count-label { font-size:9px;color:rgba(255,255,255,0.13);letter-spacing:.1em;text-transform:uppercase; }

  #footer-text {
    flex:1;font-size:clamp(7px,1.6vw,9px);
    color:rgba(255,255,255,0.18);
    text-align:center;letter-spacing:.04em;line-height:1.4;
  }

  #respond-btn {
    display:flex;align-items:center;gap:5px;
    background:rgba(155,127,232,0.18);
    border:1px solid rgba(155,127,232,0.42);
    border-radius:50px;padding:7px 14px;
    color:rgba(255,255,255,0.85);
    font-family:'DM Sans',sans-serif;font-size:12px;
    cursor:pointer;text-decoration:none;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    transition:all .2s;white-space:nowrap;flex-shrink:0;z-index:300;
  }
  #respond-btn:hover { background:rgba(155,127,232,0.32);border-color:rgba(155,127,232,.7);color:#fff; }
  #respond-btn:active { transform:scale(.96); }

  /* Paused banner */
  #paused-banner {
    display:none;
    position:fixed;top:var(--header-h);left:0;right:0;z-index:190;
    background:rgba(224,92,92,0.13);
    border-bottom:1px solid rgba(224,92,92,0.2);
    text-align:center;padding:6px;
    font-size:11px;color:rgba(224,92,92,0.8);
    letter-spacing:.06em;
  }

  /* Pan hint */
  #pan-hint {
    position:fixed;bottom:calc(var(--footer-h)+8px);left:50%;transform:translateX(-50%);
    z-index:190;font-size:10px;color:rgba(255,255,255,0.18);
    letter-spacing:.07em;pointer-events:none;white-space:nowrap;
    opacity:0;transition:opacity .6s;
  }
  #pan-hint.visible { opacity:1; }

  /* Touch hint */
  #touch-hint {
    position:fixed;top:calc(var(--header-h)+8px);left:50%;transform:translateX(-50%);
    z-index:190;font-size:10px;color:rgba(255,255,255,0.16);
    letter-spacing:.06em;pointer-events:none;white-space:nowrap;
    animation:fadeHint 5s ease 2s forwards;
  }
  @keyframes fadeHint{0%{opacity:1}75%{opacity:1}100%{opacity:0}}
  @media(hover:hover){#touch-hint{display:none}}

  /* Ambient glows */
  .glow{position:fixed;border-radius:50%;filter:blur(90px);opacity:.055;pointer-events:none;z-index:0;}
  #g1{width:420px;height:420px;background:#7c5cbf;top:-110px;left:-110px;}
  #g2{width:320px;height:320px;background:#4a9eff;bottom:-90px;right:-90px;}

  /* ── EXPANDED OVERLAY ── */
  #overlay {
    display:none;position:fixed;inset:0;
    background:rgba(5,5,10,.88);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    z-index:500;align-items:center;justify-content:center;
    padding:24px;cursor:pointer;
  }
  #overlay.active{display:flex;}

  #expanded-card {
    max-width:460px;width:100%;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.13);
    border-radius:22px;padding:34px 28px 28px;
    text-align:center;cursor:default;position:relative;
    animation:cardIn .25s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes cardIn{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}

  #expanded-tag {
    font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    margin-bottom:6px;opacity:.5;
  }
  #expanded-sem {
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    margin-bottom:18px;display:flex;align-items:center;justify-content:center;gap:8px;
  }
  #expanded-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  #expanded-text {
    font-family:'Playfair Display',serif;
    font-size:clamp(15px,4vw,23px);
    color:rgba(255,255,255,.92);line-height:1.65;font-style:italic;
  }
  #expanded-close {
    position:absolute;top:14px;right:18px;
    font-size:22px;color:rgba(255,255,255,.3);
    cursor:pointer;padding:4px 8px;
  }
  #expanded-accent{width:36px;height:3px;border-radius:2px;margin:22px auto 0;opacity:.45;}
</style>
</head>
<body>

<div class="glow" id="g1"></div>
<div class="glow" id="g2"></div>
<canvas id="canvas"></canvas>

<div id="header">
  <div id="question-display">Cargando…</div>
  <div id="tabs">
    <button class="tab-btn active" id="tab1" onclick="setTab(1)">
      <div class="shape-icon circle" style="background:#9b7fe8"></div>
      <span id="tab1-label">Pregunta 1</span>
    </button>
    <button class="tab-btn" id="tab2" onclick="setTab(2)">
      <div class="shape-icon circle" style="background:#4ab8c4"></div>
      <span id="tab2-label">Pregunta 2</span>
    </button>
  </div>
</div>

<div id="paused-banner">⏸ Las respuestas están pausadas</div>
<div id="touch-hint">Toca una voz para leerla</div>
<div id="pan-hint">⟵ arrastra para explorar ⟶</div>

<div id="footer">
  <div id="counter">
    <div id="count-num">0</div>
    <div id="count-label">voces</div>
  </div>
  <div id="footer-text">Facultad de Psicología y Terapia de la Comunicación Humana &mdash; Día del Psicólogo</div>
  <a id="respond-btn" href="responder.html">&#43; Tu voz</a>
</div>

<div id="overlay" onclick="closeExpanded()">
  <div id="expanded-card" onclick="event.stopPropagation()">
    <span id="expanded-close" onclick="closeExpanded()">×</span>
    <div id="expanded-tag"></div>
    <div id="expanded-sem"><span id="expanded-dot"></span><span id="expanded-sem-label"></span></div>
    <div id="expanded-text"></div>
    <div id="expanded-accent"></div>
  </div>
</div>

<script>
// ── FIREBASE ──
const firebaseConfig = {
  apiKey:"AIzaSyDASkxSlQ-wLmX2v7Vs9-7GzA-gwDaB5Vo",
  authDomain:"dia-del-psicologo.firebaseapp.com",
  databaseURL:"https://dia-del-psicologo-default-rtdb.firebaseio.com",
  projectId:"dia-del-psicologo",
  storageBucket:"dia-del-psicologo.firebasestorage.app",
  messagingSenderId:"1043828123841",
  appId:"1:1043828123841:web:fafe15e9b723ed83b48c40"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ── CONFIG ──
const SEMESTRES = [
  {key:'1',label:'1° Semestre',color:'#e05c8a'},
  {key:'2',label:'2° Semestre',color:'#e0885c'},
  {key:'3',label:'3° Semestre',color:'#d4c44a'},
  {key:'4',label:'4° Semestre',color:'#5cbb6e'},
  {key:'5',label:'5° Semestre',color:'#4ab8c4'},
  {key:'6',label:'6° Semestre',color:'#5c8ae0'},
  {key:'7',label:'7° Semestre',color:'#9b6be0'},
  {key:'8',label:'8° Semestre',color:'#e06b8a'},
  {key:'maestro',label:'Maestro/a',color:'#c0c0c0'},
  {key:'otro',label:'Otro',color:'#888888'},
];
const colorMap = {};
SEMESTRES.forEach(s => colorMap[s.key] = s.color);

const HEADER_H = 72, FOOTER_H = 52, PADDING = 36;
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function vW(){ return window.innerWidth; }
function vH(){ return window.innerHeight; }
function safeH(){ return vH() - HEADER_H - FOOTER_H; }

function resize(){ canvas.width = vW(); canvas.height = vH(); }
resize();
window.addEventListener('resize', resize);

// ── VIRTUAL WORLD (per tab) ──
let worldW = vW(), worldH = safeH();
let panX = 0, panY = 0;
// Per-tab world state (so each tab's exploration is preserved independently)
const world1 = { W: vW(), H: safeH(), panX: 0, panY: 0 };
const world2 = { W: vW(), H: safeH(), panX: 0, panY: 0 };

function clampPan(){
  panX = Math.max(0, Math.min(panX, Math.max(0, worldW - vW())));
  panY = Math.max(0, Math.min(panY, Math.max(0, worldH - safeH())));
}

function idealR(n){
  if(n<=0) n=1;
  const r = Math.sqrt((worldW * worldH * 0.32)/(n * Math.PI));
  return Math.min(65, Math.max(20, r));
}

function growWorldFor(n){
  const r = idealR(n);
  const need = n * Math.PI * r * r * 3.6;
  const aspect = vW() / safeH();
  const nh = Math.sqrt(need / aspect);
  const nw = nh * aspect;
  if(nw > worldW || nh > worldH){
    worldW = Math.max(worldW, nw);
    worldH = Math.max(worldH, nh);
    if(worldW > vW()*1.12 || worldH > safeH()*1.12) showPanHint();
  }
}

let panHintT = null;
function showPanHint(){
  const el = document.getElementById('pan-hint');
  el.classList.add('visible');
  clearTimeout(panHintT);
  panHintT = setTimeout(() => el.classList.remove('visible'), 4500);
}

// ── ACTIVE TAB ──
let activeTab = 1;
// bubbles1 = circles (pregunta 1), bubbles2 = squares (pregunta 2)
const bubbles1 = [], bubbles2 = [];
function activeBubbles(){ return activeTab === 1 ? bubbles1 : bubbles2; }

function setTab(n){
  // Save current tab's world state before switching
  if(activeTab===1){
    world1.W=worldW; world1.H=worldH; world1.panX=panX; world1.panY=panY;
  } else {
    world2.W=worldW; world2.H=worldH; world2.panX=panX; world2.panY=panY;
  }
  activeTab = n;
  // Restore the target tab's world state
  const w = n===1 ? world1 : world2;
  worldW=w.W; worldH=w.H; panX=w.panX; panY=w.panY;
  clampPan();
  // Update UI
  document.getElementById('tab1').classList.toggle('active', n===1);
  document.getElementById('tab2').classList.toggle('active', n===2);
  updateCounter();
  refreshQuestion();
}

// ── QUESTIONS (stored from Firebase) ──
let q1text = '', q2text = '';

function refreshQuestion(){
  const q = activeTab===1 ? q1text : q2text;
  document.getElementById('question-display').textContent = q || '—';
}

// ── BUBBLE CLASS ──
class Bubble {
  constructor(data, shape){
    this.data  = data;
    this.shape = shape; // 'circle' | 'square'
    this.color = colorMap[data.semestre] || '#888';

    const list = shape==='circle' ? bubbles1 : bubbles2;
    const base = idealR(list.length + 1);
    this.r = base * (0.72 + Math.random() * 0.56);

    this.x = PADDING + this.r + Math.random() * Math.max(0, worldW - this.r*2 - PADDING*2);
    this.y = PADDING + this.r + Math.random() * Math.max(0, worldH - this.r*2 - PADDING*2);
    this.vx = (Math.random()-.5)*.5;
    this.vy = (Math.random()-.5)*.5;
    this.wobble = Math.random()*Math.PI*2;
    this.wobbleSpeed = .009 + Math.random()*.011;
    this.opacity = 0;
    this.birth = Date.now();
    this.hovered = false;
    this.scale = 1;

    const words = data.texto.split(' ');
    this.preview = words.slice(0,4).join(' ') + (words.length>4?'…':'');
  }

  relaxR(){
    const list = this.shape==='circle' ? bubbles1 : bubbles2;
    const t = idealR(list.length) * (0.72 + Math.random()*.56);
    if(t < this.r) this.r = this.r*.998 + t*.002;
  }

  update(){
    this.wobble += this.wobbleSpeed;
    this.x += this.vx + Math.sin(this.wobble)*.20;
    this.y += this.vy + Math.cos(this.wobble*.75)*.14;

    if(this.x - this.r < 0)      { this.x = this.r;          this.vx =  Math.abs(this.vx); }
    if(this.x + this.r > worldW) { this.x = worldW - this.r; this.vx = -Math.abs(this.vx); }
    if(this.y - this.r < 0)      { this.y = this.r;           this.vy =  Math.abs(this.vy); }
    if(this.y + this.r > worldH) { this.y = worldH - this.r;  this.vy = -Math.abs(this.vy); }

    const age = (Date.now()-this.birth)/1000;
    if(this.opacity < 1) this.opacity = Math.min(1, age*.7);
    this.scale += ((this.hovered ? 1.1 : 1) - this.scale)*.12;
  }

  collide(other){
    const dx=other.x-this.x, dy=other.y-this.y;
    const d=Math.sqrt(dx*dx+dy*dy), m=this.r+other.r+1.5;
    if(d<m && d>0){
      const nx=dx/d, ny=dy/d, ov=(m-d)/2;
      this.x-=nx*ov; this.y-=ny*ov;
      other.x+=nx*ov; other.y+=ny*ov;
      const dvx=this.vx-other.vx, dvy=this.vy-other.vy;
      const dot=dvx*nx+dvy*ny;
      if(dot>0){ const k=dot*.5; this.vx-=k*nx; this.vy-=k*ny; other.vx+=k*nx; other.vy+=k*ny; }
    }
  }

  sx(){ return this.x - panX; }
  sy(){ return this.y - panY + HEADER_H; }

  isVisible(){
    const x=this.sx(), y=this.sy(), m=this.r*1.8;
    return x+m>0 && x-m<vW() && y+m>HEADER_H && y-m<vH()-FOOTER_H;
  }

  draw(){
    if(!this.isVisible()) return;
    ctx.save();
    ctx.translate(this.sx(), this.sy());
    ctx.scale(this.scale, this.scale);
    ctx.globalAlpha = this.opacity;

    const r=this.r, hex=this.color;

    this._drawCircle(r, hex);

    // Text
    const fs = Math.max(7, r*.24);
    ctx.fillStyle='rgba(255,255,255,0.9)';
    ctx.font=`${fs}px 'DM Sans'`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    const maxW=r*1.38, lh=fs*1.28;
    const wds=this.preview.split(' ');
    const lns=[]; let cur='';
    for(const w of wds){
      const t=cur?cur+' '+w:w;
      if(ctx.measureText(t).width>maxW && cur){lns.push(cur);cur=w;}else cur=t;
    }
    if(cur) lns.push(cur);
    const sy0=-(lns.length-1)*lh/2;
    lns.forEach((l,i)=>ctx.fillText(l,0,sy0+i*lh));

    ctx.restore();
  }

  _drawCircle(r, hex){
    // Glow
    const glow=ctx.createRadialGradient(0,0,r*.5,0,0,r*1.55);
    glow.addColorStop(0,hex+'1c'); glow.addColorStop(1,'transparent');
    ctx.beginPath(); ctx.arc(0,0,r*1.55,0,Math.PI*2); ctx.fillStyle=glow; ctx.fill();
    // Body
    const body=ctx.createRadialGradient(-r*.25,-r*.3,r*.05,0,0,r);
    body.addColorStop(0,hex+'cc'); body.addColorStop(.5,hex+'66'); body.addColorStop(1,hex+'1e');
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fillStyle=body; ctx.fill();
    // Rim
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2);
    ctx.strokeStyle=hex+'70'; ctx.lineWidth=1; ctx.stroke();
    // Highlights
    const h1=ctx.createRadialGradient(-r*.3,-r*.35,0,-r*.2,-r*.25,r*.5);
    h1.addColorStop(0,'rgba(255,255,255,.5)'); h1.addColorStop(1,'rgba(255,255,255,0)');
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fillStyle=h1; ctx.fill();
  }

  _drawStar(r, hex){
    // 8-point star: alternates outer radius r and inner radius r*0.45
    const pts=8, inner=r*.42, outer=r;
    ctx.beginPath();
    for(let i=0;i<pts*2;i++){
      const ang = (i*Math.PI/pts) - Math.PI/2;
      const rad = i%2===0 ? outer : inner;
      i===0 ? ctx.moveTo(Math.cos(ang)*rad, Math.sin(ang)*rad)
            : ctx.lineTo(Math.cos(ang)*rad, Math.sin(ang)*rad);
    }
    ctx.closePath();
    // Flat fill — no gradients, no shadows (keeps it fast)
    ctx.fillStyle = hex + 'aa';
    ctx.fill();
    // Rim
    ctx.strokeStyle = hex + '88';
    ctx.lineWidth = 1;
    ctx.stroke();
    // Single small top-left shimmer
    ctx.beginPath();
    for(let i=0;i<pts*2;i++){
      const ang=(i*Math.PI/pts)-Math.PI/2;
      const rad=i%2===0?outer:inner;
      i===0?ctx.moveTo(Math.cos(ang)*rad,Math.sin(ang)*rad):ctx.lineTo(Math.cos(ang)*rad,Math.sin(ang)*rad);
    }
    ctx.closePath();
    ctx.fillStyle='rgba(255,255,255,0.13)';
    ctx.fill();
  }

  _roundRect(x,y,w,h,rad){
    ctx.beginPath();
    ctx.moveTo(x+rad,y);
    ctx.lineTo(x+w-rad,y); ctx.quadraticCurveTo(x+w,y,x+w,y+rad);
    ctx.lineTo(x+w,y+h-rad); ctx.quadraticCurveTo(x+w,y+h,x+w-rad,y+h);
    ctx.lineTo(x+rad,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-rad);
    ctx.lineTo(x,y+rad); ctx.quadraticCurveTo(x,y,x+rad,y);
    ctx.closePath();
  }

  hitTest(sx,sy){
    const dx=sx-this.sx(), dy=sy-this.sy();
    return Math.sqrt(dx*dx+dy*dy) < this.r * this.scale * 1.1;
  }
}

// ── PAN ──
let isDragging=false, dragDist=0, dragSX=0, dragSY=0, panSX=0, panSY=0;

canvas.addEventListener('mousedown', e=>{
  isDragging=true; dragDist=0;
  dragSX=e.clientX; dragSY=e.clientY; panSX=panX; panSY=panY;
  document.body.classList.add('dragging');
});
window.addEventListener('mousemove', e=>{
  if(!isDragging){ for(const b of activeBubbles()) b.hovered=b.hitTest(e.clientX,e.clientY); return; }
  const dx=e.clientX-dragSX, dy=e.clientY-dragSY;
  dragDist+=Math.abs(dx)+Math.abs(dy);
  panX=panSX-dx; panY=panSY-dy; clampPan();
});
window.addEventListener('mouseup', e=>{
  if(!isDragging) return;
  document.body.classList.remove('dragging');
  isDragging=false;
  if(dragDist<6){
    for(let i=activeBubbles().length-1;i>=0;i--){
      if(activeBubbles()[i].hitTest(e.clientX,e.clientY)){ openExpanded(activeBubbles()[i]); break; }
    }
  }
});

canvas.addEventListener('touchstart', e=>{
  e.preventDefault();
  if(e.touches.length!==1) return;
  const t=e.touches[0];
  isDragging=true; dragDist=0;
  dragSX=t.clientX; dragSY=t.clientY; panSX=panX; panSY=panY;
},{passive:false});

canvas.addEventListener('touchmove', e=>{
  e.preventDefault();
  if(e.touches.length!==1) return;
  const t=e.touches[0];
  const dx=t.clientX-dragSX, dy=t.clientY-dragSY;
  dragDist+=Math.abs(dx)+Math.abs(dy);
  panX=panSX-dx; panY=panSY-dy; clampPan();
},{passive:false});

canvas.addEventListener('touchend', e=>{
  e.preventDefault();
  isDragging=false;
  if(dragDist<10){
    const t=e.changedTouches[0];
    for(let i=activeBubbles().length-1;i>=0;i--){
      if(activeBubbles()[i].hitTest(t.clientX,t.clientY)){ openExpanded(activeBubbles()[i]); break; }
    }
  }
},{passive:false});

// ── EXPANDED ──
function openExpanded(b){
  const sem=SEMESTRES.find(s=>s.key===b.data.semestre)||{label:b.data.semestre,color:'#888'};
  const pLabel = b.shape==='circle' ? (q1text||'Pregunta 1') : (q2text||'Pregunta 2');
  document.getElementById('expanded-tag').textContent = b.shape==='circle' ? '● Voz — Pregunta 1' : '● Voz — Pregunta 2';
  document.getElementById('expanded-tag').style.color = b.shape==='circle' ? '#9b7fe8' : '#4ab8c4';
  document.getElementById('expanded-dot').style.background    = sem.color;
  document.getElementById('expanded-dot').style.borderRadius  = '50%';
  document.getElementById('expanded-sem-label').textContent   = sem.label;
  document.getElementById('expanded-sem').style.color         = sem.color;
  document.getElementById('expanded-text').textContent        = `"${b.data.texto}"`;
  document.getElementById('expanded-accent').style.background = sem.color;
  document.getElementById('overlay').classList.add('active');
}
function closeExpanded(){ document.getElementById('overlay').classList.remove('active'); }
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeExpanded(); });

// ── COUNTER ──
function updateCounter(){
  document.getElementById('count-num').textContent = activeBubbles().length;
}

// ── RENDER LOOP ──
let frame=0;
function loop(){
  ctx.clearRect(0,0,vW(),vH());
  ctx.save();
  ctx.beginPath();
  ctx.rect(0,HEADER_H,vW(),safeH());
  ctx.clip();

  frame++;
  const ab = activeBubbles();
  if(frame%90===0) for(const b of ab) b.relaxR();
  for(const b of ab) b.update();

  const cap=Math.min(ab.length,180);
  for(let i=0;i<cap;i++) for(let j=i+1;j<cap;j++) ab[i].collide(ab[j]);
  for(const b of ab) b.draw();

  ctx.restore();
  requestAnimationFrame(loop);
}
loop();

// ── FIREBASE ──
db.ref('respuestas_p1').on('child_added', snap=>{
  const data=snap.val();
  if(!data||!data.texto||!data.semestre) return;
  growWorldFor(bubbles1.length+1);
  bubbles1.push(new Bubble(data,'circle'));
  if(activeTab===1) updateCounter();
});

db.ref('respuestas_p2').on('child_added', snap=>{
  const data=snap.val();
  if(!data||!data.texto||!data.semestre) return;
  // Always grow world2 regardless of active tab
  const prevW=worldW, prevH=worldH;
  if(activeTab!==2){ worldW=world2.W; worldH=world2.H; }
  growWorldFor(bubbles2.length+1);
  if(activeTab!==2){ world2.W=worldW; world2.H=worldH; worldW=prevW; worldH=prevH; }
  bubbles2.push(new Bubble(data,'circle'));
  if(activeTab===2) updateCounter();
});

db.ref('pregunta1').on('value', snap=>{
  q1text = snap.val()||'';
  document.getElementById('tab1-label').textContent = q1text ? q1text.split(' ').slice(0,3).join(' ')+'…' : 'Pregunta 1';
  if(activeTab===1) refreshQuestion();
});

db.ref('pregunta2').on('value', snap=>{
  q2text = snap.val()||'';
  document.getElementById('tab2-label').textContent = q2text ? q2text.split(' ').slice(0,3).join(' ')+'…' : 'Pregunta 2';
  if(activeTab===2) refreshQuestion();
});

db.ref('pausado').on('value', snap=>{
  const p = snap.val()===true;
  document.getElementById('paused-banner').style.display = p ? 'block' : 'none';
});
</script>
